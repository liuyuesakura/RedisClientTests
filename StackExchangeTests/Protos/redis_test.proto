syntax = "proto3";

option csharp_namespace = "StackExchangeTests.Grpc";

package stackexchange.tests;

service RedisGetTest {
  rpc TriggerGet (TriggerGetRequest) returns (TriggerGetReply);
  rpc TriggerPipeline (TriggerPipelineRequest) returns (TriggerPipelineReply);
  rpc TriggerCacheShell (TriggerCacheShellRequest) returns (TriggerCacheShellReply);
  rpc GetSlotInfos (GetSlotInfosRequest) returns (GetSlotInfosReply);
  rpc GetNodeInfos (GetNodeInfosRequest) returns (GetNodeInfosReply);
}

message TriggerGetRequest {
  string key = 1;
}

message TriggerGetReply {
  bool found = 1;
  string value = 2;
  string message = 3;
}

message TriggerPipelineRequest {
  string key_prefix = 1;
  int32 key_count = 2;
  int32 expiry_seconds = 3;
  bool same_hashtag = 4;
}

message PipelineEntry {
  string key = 1;
  string value = 2;
  int32 slot = 3;
}

message TriggerPipelineReply {
  bool ok = 1;
  string scenario = 2;
  int32 distinct_slots = 3;
  repeated int32 slots = 4;
  repeated PipelineEntry entries = 5;
  string message = 6;
}

message TriggerCacheShellRequest {
  string key_prefix = 1;
  int32 expiry_seconds = 2;
  string hash_field = 3;
}

message TriggerCacheShellReply {
  bool ok = 1;
  string string_first = 2;
  string string_second = 3;
  int32 string_factory_calls = 4;
  string hash_first = 5;
  string hash_second = 6;
  int32 hash_factory_calls = 7;
  string message = 8;
}

message GetSlotInfosRequest {
  repeated string keys = 1;
}

message SlotInfo {
  string key = 1;
  string hash_input = 2;
  int32 slot = 3;
}

message GetSlotInfosReply {
  repeated SlotInfo infos = 1;
}

message GetNodeInfosRequest {}

message NodeInfo {
  string endpoint = 1;
  bool reachable = 2;
  string role = 3;
  string slots = 4;
  string message = 5;
}

message GetNodeInfosReply {
  repeated NodeInfo infos = 1;
  string message = 2;
}
