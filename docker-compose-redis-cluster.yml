  redis-cluster-init:
    image: redis:8-alpine
    container_name: redis-cluster-init
    networks:
      - redis-cluster-net
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
      redis-cluster-6:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        echo '[redis-cluster-init] Waiting for nodes to accept CLUSTER commands...'
        sleep 2
        if redis-cli -h redis-cluster-1 -p 6379 CLUSTER INFO 2>/dev/null | grep -q 'cluster_state:ok'; then
          echo '[redis-cluster-init] cluster_state already ok, skipping create.'
          redis-cli -h redis-cluster-1 -p 6379 CLUSTER INFO | head -5
          exit 0
        fi
        echo '[redis-cluster-init] Creating cluster (3 masters, 3 replicas)...'
        redis-cli --cluster create \
          redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379 \
          redis-cluster-4:6379 redis-cluster-5:6379 redis-cluster-6:6379 \
          --cluster-replicas 1 --cluster-yes
        echo '[redis-cluster-init] Verifying (poll until cluster_state:ok)...'
        for i in $$(seq 1 60); do
          if redis-cli -h redis-cluster-1 -p 6379 CLUSTER INFO 2>/dev/null | grep -q 'cluster_state:ok'; then
            echo '[redis-cluster-init] cluster_state:ok'
            redis-cli -h redis-cluster-1 -p 6379 CLUSTER INFO | grep -E 'cluster_state|cluster_slots_assigned|cluster_known_nodes'
            exit 0
          fi
          sleep 1
        done
        echo '[redis-cluster-init] ERROR: cluster_state not ok within 60s'
        redis-cli -h redis-cluster-1 -p 6379 CLUSTER INFO
        exit 1

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.stackexchange
    image: stackexchange-tests-app:local
    container_name: stackexchange-tests-app
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    working_dir: /app
    command: ["dotnet", "StackExchangeTests.dll"]
    networks:
      - redis-cluster-net

  csredis-tests-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.csredis
    image: csredis-tests-app:local
    container_name: csredis-tests-app
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    working_dir: /app
    tty: true
    stdin_open: true
    command: ["dotnet", "CsredisTests.dll"]
    networks:
      - redis-cluster-net

  freeredis-tests-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.freeredis
    image: freeredis-tests-app:local
    container_name: freeredis-tests-app
    depends_on:
      redis-cluster-init:
        condition: service_completed_successfully
    working_dir: /app
    tty: true
    stdin_open: true
    command: ["dotnet", "FreeRedisTests.dll"]
    networks:
      - redis-cluster-net

networks:
  redis-cluster-net:
    driver: bridge
