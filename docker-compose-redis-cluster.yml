      start_period: 8s

  redis-cluster-5:
    image: redis:8-alpine
    container_name: redis-cluster-5
    hostname: redis-cluster-5
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - redis-cluster-5
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    ports:
      - "6383:6379"
      - "16383:16379"
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 8s

  redis-cluster-6:
    image: redis:8-alpine
    container_name: redis-cluster-6
    hostname: redis-cluster-6
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - redis-cluster-6
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    ports:
