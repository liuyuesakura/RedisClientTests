# Redis Cluster：6 节点（3 主 + 3 从），无 Sentinel。
# 每个服务设置 hostname 与 cluster-announce-hostname 一致，避免 CLUSTER 握手失败。
# 首次由 redis-cluster-init 执行 redis-cli --cluster create；重建集群：docker compose down -v 后再 up。
# 哨兵版副本：docker-compose-redis-cluster.sentinel.yml
services:
  redis-cluster-1:
    image: redis:8-alpine
    container_name: redis-cluster-1
    hostname: redis-cluster-1
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - redis-cluster-1
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    ports:
      - "6379:6379"
      - "16379:16379"
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 25
      start_period: 8s

  redis-cluster-2:
    image: redis:8-alpine
    container_name: redis-cluster-2
    hostname: redis-cluster-2
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --appendonly
      - "yes"
      - --cluster-announce-hostname
      - redis-cluster-2
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
    ports:
      - "6380:6379"
      - "16380:16379"
    networks:
      - redis-cluster-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
