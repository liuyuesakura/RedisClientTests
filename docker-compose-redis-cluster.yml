      timeout: 3s
      retries: 25
      start_period: 8s

  redis-cluster-3:
    image: redis:8-alpine
    container_name: redis-cluster-3
    hostname: redis-cluster-3
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
