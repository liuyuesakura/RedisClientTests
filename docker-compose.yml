services:
  redis-master:
    image: redis:8-alpine
    container_name: redis-master
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - redis-net

  redis-replica-1:
    image: redis:8-alpine
    container_name: redis-replica-1
    depends_on:
      - redis-master
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    networks:
      - redis-net

  redis-replica-2:
    image: redis:8-alpine
    container_name: redis-replica-2
    depends_on:
      - redis-master
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    networks:
      - redis-net

  redis-sentinel:
    image: redis:8-alpine
    container_name: redis-sentinel
    depends_on:
      - redis-master
    command:
      - sh
      - -c
      - |
        cat <<EOF > /tmp/sentinel.conf
        port 26379
        dir /tmp
        sentinel resolve-hostnames yes
        sentinel monitor mymaster redis-master 6379 1
        sentinel down-after-milliseconds mymaster 5000
        sentinel failover-timeout mymaster 10000
        sentinel parallel-syncs mymaster 1
        EOF
        redis-server /tmp/sentinel.conf --sentinel
    ports:
      - "26379:26379"
    networks:
      - redis-net

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.stackexchange
    image: stackexchange-tests-app:local
    container_name: stackexchange-tests-app
    depends_on:
      - redis-sentinel
    working_dir: /app
    command: ["dotnet", "StackExchangeTests.dll"]
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge
